name: Godot Android validation and APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        run: python3 -m unittest discover -s tests -q
      - name: Import and parse
        run: godot --headless --path . --editor --quit
      - name: Runtime smoke test
        run: godot --headless --path . --script res://tools/godot_smoke.gd
      - name: Android debug export
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/eternal-legends-debug.apk
          test -s build/eternal-legends-debug.apk
          sha256sum build/eternal-legends-debug.apk | tee build/SHA256SUMS.txt
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eternal-legends-android-debug
          path: |
            build/eternal-legends-debug.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7